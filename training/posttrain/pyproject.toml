[project]
name = "strata-training"
version = "0.1.0"
description = "Fixed-layer deep supervision for Depth Pro 2"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2",
    "strata-dataset",
    "torch>=2.6",
    "OpenEXR>=3.3",
    "scipy>=1.14",
    "pillow>=11",
    "depth-pro-2",
    "av>=14",
]

[project.optional-dependencies]
cpu = ["torch==2.15.0", "torchvision==0.29.2"]
cuda = ["torch==2.15.0", "torchvision==0.29.2"]

[project.scripts]
strata-train = "strata_training.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "pyright>=1.1.400",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu132", extra = "cuda" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu132", extra = "cuda" }]
strata-dataset = { path = "../../contract/dataset", editable = true }
depth-pro-2 = { git = "https://github.com/apple-aiml-research/ml-depth-pro-2", rev = "aa389cbb0b74341664ed663a0966c859905cd6c0" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "PT", "ARG", "DTZ", "T10", "T20"]
ignore = ["T201"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
