[project]
name = "strata-training"
version = "0.1.0"
description = "Fixed-layer deep supervision for Depth Pro 2"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2", "torch>=2.6", "OpenEXR>=3.3", "scipy>=1.14", "pillow>=11", "depth-pro-2"]

[project.scripts]
strata-train = "strata_training.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "pyright>=1.1.400",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
depth-pro-2 = { git = "https://github.com/apple-aiml-research/ml-depth-pro-2", rev = "aa389cbb0b74341664ed663a0966c859905cd6c0" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "PT", "ARG", "DTZ", "T10", "T20"]
ignore = ["T201"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
