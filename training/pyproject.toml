[project]
name = "strata-train"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "depth-pro-2",
  "numpy>=2.0",
  "onnx==1.23.2",
  "onnxscript==0.7.2",
  "OpenEXR>=3.4",
  "pillow>=11.3",
  "strata-contract",
  "torch==2.15.0",
  "torchvision==0.29.2",
]

[project.optional-dependencies]
cpu = ["torch==2.15.0", "torchvision==0.29.2"]
cuda = ["torch==2.15.0", "torchvision==0.29.2"]

[dependency-groups]
dev = ["openimageio==3.2.2.0", "pyright==1.1.414", "ruff==0.17.6"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
strata-contract = { path = "../contract", editable = true }
torch = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu132", extra = "cuda" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }, { index = "pytorch-cu132", extra = "cuda" }]
depth-pro-2 = { git = "https://github.com/apple-aiml-research/ml-depth-pro-2", rev = "aa389cbb0b74341664ed663a0966c859905cd6c0" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "PERF", "RET", "RUF", "ANN", "PTH", "ARG", "NPY", "FLY"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["strata_train", "tests", "../contract/strata_contract"]
venvPath = "."
venv = ".venv"
stubPath = "typings"
